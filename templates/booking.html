<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking for {{ competition['name'] }} | GUDLFT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Booking for {{ competition['name'] }}</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <p><strong>Places available:</strong> {{ competition['numberOfPlaces'] }}</p>

        <form action="{{ url_for('purchasePlaces') }}" method="post">
            <input type="hidden" name="club" value="{{ club['name'] }}">
            <input type="hidden" name="competition" value="{{ competition['name'] }}">

            <div class="form-group">
                <label for="places">How many places?</label>
                <input type="number" name="places" id="places" min="1" required placeholder="e.g. 5">
            </div>
            <button type="submit">Book</button>
        </form>

                <div style="text-align: center; margin-top: 2rem;">
            <!-- On utilise l'historique du navigateur pour revenir en arrière -->
            <a href="javascript:history.back()" style="color: #6B7280; font-weight: 400; text-decoration: none;">← Retour</a>
        </div>
</body>
</html>
