<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver - {{ competition['name'] }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h2 style="text-align: center; margin-bottom: 0.5rem;">{{ competition['name'] }}</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">
            Places disponibles: <strong>{{ competition['numberOfPlaces'] }}</strong>
        </p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('purchase_places') }}" method="post">
            <input type="hidden" name="club" value="{{ club['name'] }}">
            <input type="hidden" name="competition" value="{{ competition['name'] }}">

            <div class="form-group">
                <label for="places">Combien de places souhaitez-vous réserver ?</label>
                <input type="number" name="places" id="places" min="1" max="12" required placeholder="Max 12 places">
            </div>
            <button type="submit">Confirmer la réservation</button>
        </form>

        <div class="text-center">
            <a href="javascript:history.back()" style="color: var(--text-muted); text-decoration: none;">← Retour</a>
        </div>
    </div>
</body>
</html>
