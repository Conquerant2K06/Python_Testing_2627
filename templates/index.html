<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUDLFT Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to GUDLFT</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('showSummary') }}" method="post">
            <div class="form-group">
                <label for="email">Secretary Email</label>
                <input type="email" name="email" id="email" placeholder="john@simplylift.co" required>
            </div>
            <button type="submit">Enter</button>
        </form>
    </div>
</body>
</html>
